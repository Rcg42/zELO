<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zELO | Contato</title>
  <!-- CSS e JavaScript externos -->
  <link rel="stylesheet" href="css/style.css">
  <script src="js/java.js" defer></script>
</head>
<body>
  <!-- Cabeçalho com logo e menu de navegação -->
  <header>
    <nav>
      <p class="logo"><a href="index.html">zELO</a></p>
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="integrantes.html">Integrantes</a></li>
        <li><a href="sobre.html">Sobre</a></li>
        <li><a href="solucao.html">Solução</a></li>
        <li><a href="cadastro.html">Cadastro</a></li>
        <li><a href="doacoes.html">Doações</a></li>

        <li><a href="faq.html">FAQ</a></li>
        <li><a class="ativo" href="contato.html">Contato</a></li>
      </ul>
    </nav>
  </header>

  <!-- Conteúdo principal da página -->
  <main>
    <!-- Título da página -->
    <section class="topo">
      <h1>Contato</h1>
      <p>Entre em contato com a equipe.</p>
    </section>

    <!-- Texto e formulário de contato (validação no JavaScript) -->
    <section class="secao duas-colunas">
      <div>
        <h2>Fale conosco</h2>
        <p>Use o formulário para enviar uma mensagem sobre o projeto.</p>
      </div>
      <form id="form-contato">
        <label for="nome">Nome</label>
        <input id="nome" type="text" placeholder="Seu nome">

        <label for="email">E-mail</label>
        <input id="email" type="email" placeholder="seuemail@email.com">

        <label for="mensagem">Mensagem</label>
        <textarea id="mensagem" rows="6" placeholder="Digite sua mensagem"></textarea>

        <button class="botao" type="submit">Enviar</button>
      </form>
    </section>
  </main>

  <!-- Rodapé -->
  <footer>
    <p>zELO - Projeto acadêmico</p>
    <p><a href="index.html">Início</a> | <a href="sobre.html">Sobre</a> | <a href="faq.html">FAQ</a> | <a href="contato.html">Contato</a></p>
  </footer>
